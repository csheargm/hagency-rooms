<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hagency</title><meta name="hagency-homeserver" content="__HAGENCY_HOMESERVER__"><meta name="hagency-element" content="__HAGENCY_ELEMENT__">
<style>
:root{--bg:#f7f7f8;--card:#fff;--ink:#17191c;--muted:#6b7078;--line:#e4e6ea;--accent:#0b6e4f;--accent-soft:#e3f2ec;
--warn:#8a5a00;--warn-soft:#fff4dc;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1d2024;--ink:#e8eaed;--muted:#9aa0a8;--line:#2c3036;
--accent:#3fb68b;--accent-soft:#17352b;--warn:#f0b54a;--warn-soft:#3a2f17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding:16px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:12px}.stack{display:grid;gap:12px;min-width:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:650}.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--card);
border:1px solid var(--line);font-size:12px;color:var(--muted)}.chip.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
a.chip{color:var(--accent);font-weight:600;text-decoration:none}a.chip:hover{border-color:var(--accent)}
.chip.role{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:650}
.card.attn{border-color:var(--warn);background:var(--warn-soft)}.card.attn h2{color:var(--warn)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.set{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 0}
.set+.set{border-top:1px solid var(--line)}.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;border-radius:0;margin:0;background:transparent;padding:5px 12px;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--accent);color:#fff}
button{font:inherit;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.quiet{border:0;background:transparent;color:var(--accent);padding:2px 4px;font-size:12px;text-decoration:underline}
.field{display:flex;gap:8px;flex-wrap:wrap}input{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:8px;
background:var(--bg);color:var(--ink);flex:1;min-width:12em}input.code{flex:0;min-width:0;font-family:ui-monospace,Menlo,monospace}
#msg:empty{display:none}#msg{padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);white-space:pre-line}
.board{font-size:13.5px}.board p{margin:4px 0}.board ul{margin:4px 0;padding-left:18px}.board a{color:var(--accent)}
.agents{list-style:none;margin:0;padding:0}.agents li{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0}
.agents li+li{border-top:1px solid var(--line)}.agents b{font-weight:600}.muted{color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:4px 0 8px}
#password{display:grid;gap:6px;max-width:340px;margin-top:14px}#password h2{margin:0 0 2px}#password button{justify-self:start}
</style>
<div class="wrap"><header><div><h1 id="title">Hagency</h1><div class="sub" id="sub"></div></div><div class="sub"><a class="chip" href="__ELEMENT_HOME__" target="_blank" rel="noopener" data-home="1">🏠 Welcome steps</a><span id="who"></span></div></header>
<div id="me" class="muted">Signing in…</div><div id="msg"></div><div id="controls" class="stack"></div><div id="cards" class="stack"></div><div id="p" class="stack"></div>
<footer>Change anything here or by telling @pm in the chat.__VERSION__</footer></div>
__SCRIPTS__
<script src="/auth/signin.js"></script>
<script>
const q = new URLSearchParams(location.search), wid = q.get("widgetId");
// Popped out of Element (its ↗ button) the panel signs people in itself; Google or GitHub return to this
// address without ?room, so the room is kept in this tab while they're away (sessionStorage).
const room = q.get("room") || (() => { try { return sessionStorage.getItem("hagency-room"); } catch (e) { return null; } })();
try { if (room) sessionStorage.setItem("hagency-room", room); } catch (e) { /* blocked: the room is in the address */ }
// The Element apps allowed to frame the panel (panel.EMBEDDERS); ELEMENT: the one that does, from its
// capabilities request (Element speaks first), and from then on only that one.
const EMBEDDERS = __EMBEDDERS__;
let ELEMENT = null;
const embedded = window.parent !== window && !!wid;
let session = null;
try { session = sessionStorage.getItem("hagency-session"); } catch (e) { /* storage blocked: signs in on each load */ }
// A login code arrives after "#" (never sent to the server): take it, then wipe it at once.
let linkCode = new URLSearchParams(location.hash.slice(1)).get("login");
if (location.hash) history.replaceState(null, "", location.pathname + location.search);
const $ = id => document.getElementById(id);
if (typeof localizeFooter === "function") localizeFooter($("vertime"));   // panel_agents.js: the viewer's own time
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Signing in never hangs silently (screen test: "Signing in…" forever): every way it can fail says so in one line.
const LINK = ' Or say "@pm send me my console link" in the room.';
const NO_ANSWER = "Couldn't sign you in: Element didn't answer. Reload the page to try again." + LINK;
const REFUSED = "Couldn't sign you in: Element didn't share who you are." + LINK;
const OFFLINE = "The Hagency server didn't answer properly just now. Reload the page to try again.";
let watchdog = null;
const say = t => { $("me").textContent = t; };
function failed(t) { clearTimeout(watchdog); say(t); }
function signingIn() { clearTimeout(watchdog); say("Signing in…"); watchdog = setTimeout(() => failed(embedded ? NO_ANSWER : OFFLINE), __SIGNIN_MS__); }
// Every request gives up in time (GPT re-check: a stalled poll froze the panel on its last view).
const deadline = () => typeof AbortSignal !== "undefined" && AbortSignal.timeout ? AbortSignal.timeout(__SIGNIN_MS__) : undefined;
async function post(path, body) {
  try { const r = await fetch(path, {method: "POST", signal: deadline(), headers: {"Content-Type": "application/json",
      "Authorization": "Bearer " + (session || "")}, body: JSON.stringify(body)}); return await r.json(); }
  catch (e) { return {error: OFFLINE}; }    // no network, or a proxy's error page instead of our JSON
}
function signedIn(s) { session = s;       // the watchdog runs on until the first view arrives (GPT review)
  try { sessionStorage.setItem("hagency-session", s); } catch (e) { /* storage blocked: kept for this page only */ }
  refresh(); }
// Inside Element only: the Matrix widget API, talking to Element's exact origin and our parent frame.
let openidRequest = null, gotCredentials = false, capable = false, expired = 0;
// "Your chat with Product Manager" is a link (pmChatLink): inside Element it opens that chat in place through
// the widget API's navigate (MSC2931; pre-approved for our panel only: deploy/element_home.py), else (or
// if Element refuses) a matrix.to link in a new tab.
const NAVIGATE = "org.matrix.msc2931.navigate", NAV_WAIT_MS = 4000;
let canNavigate = false, navRequest = null, navHref = "", pmChat = null, inPmChat = false;   // inPmChat: My Hagency
if (embedded) window.addEventListener("message", ev => {
  const m = ev.data || {};
  if (!EMBEDDERS.includes(ev.origin) || ev.source !== window.parent || m.widgetId !== wid) return;
  if (!ELEMENT && !(m.api === "toWidget" && m.action === "capabilities")) return;   // pinned by Element's first request
  if (ELEMENT && ev.origin !== ELEMENT) return;
  ELEMENT = ev.origin;
  if (m.api === "toWidget") {
    const ack = {api: "toWidget", widgetId: wid, requestId: m.requestId, action: m.action, data: {},
                 response: m.action === "capabilities" ? {capabilities: [NAVIGATE]} : {}};   // never echo credentials
    window.parent.postMessage(ack, ELEMENT);
    if (m.action === "capabilities" && !capable) { capable = true; if (!session) setTimeout(askOpenId, 300); }
    if (m.action === "notify_capabilities") canNavigate = ((m.data || {}).approved || []).includes(NAVIGATE);
    if (m.action === "openid_credentials" && openidRequest && m.data && m.data.original_request_id === openidRequest)
      m.data.state === "allowed" ? gotToken(m.data) : failed(REFUSED);   // after Element's prompt
  } else if (m.api === "fromWidget" && navRequest && m.requestId === navRequest && m.response) {
    navRequest = null;
    if (m.response.error) navFallback();
  } else if (m.api === "fromWidget" && m.requestId === openidRequest && m.response) {
    const r = m.response;
    if (r.state === "allowed") gotToken(r);
    else if (r.state === "request") failed("Allow Hagency in Element's prompt to sign in.");   // a person's answer: no timeout
    else failed(r.state === "blocked" ? REFUSED : NO_ANSWER);   // an error reply ({error}) included
  }
});
function askOpenId() { gotCredentials = false; openidRequest = "openid-" + crypto.randomUUID(); signingIn();
  window.parent.postMessage({api: "fromWidget", widgetId: wid, requestId: openidRequest, action: "get_openid", data: {}}, ELEMENT); }
// The server that issued the token checks it (ours, or theirs over federation: fed_openid.py).
async function gotToken(c) { if (gotCredentials) return; gotCredentials = true; signingIn();
  const r = await post("/auth/openid", {access_token: c.access_token, matrix_server_name: c.matrix_server_name}); r.session ? signedIn(r.session) : failed(r.error || NO_ANSWER); }
async function start() {
  if (linkCode) { const code = linkCode; linkCode = null; signingIn();   // used once: never replayed (GPT review)
    const r = await post("/auth/link", {code});
    return r.session ? signedIn(r.session) : failed(r.error || OFFLINE); }
  if (session) { signingIn(); return refresh(); }
  if (!embedded) {
    const lent = await borrowSession();   // the Element tab's panel is signed in: no second sign-in
    return lent ? signedIn(lent) : showSignIn();
  }
  capable ? askOpenId() : signingIn();      // a session that expired: ask Element again
}
// Popped out: first ask the panel still open in Element (same browser, this origin only) for its session over a
// BroadcastChannel; nothing is stored. Only a whole-page tab asks, and only the embedded panel answers.
const HANDOFF = typeof BroadcastChannel === "function" ? new BroadcastChannel("hagency-panel") : null;
if (HANDOFF && embedded) HANDOFF.onmessage = ev => {
  if (ev.data && ev.data.ask === "session" && session) HANDOFF.postMessage({session});
};
let borrowed = false;                     // once per tab: a rejected one goes to sign-in, never round again (GPT review)
function borrowSession() {               // resolves to a session from the Element tab, or null within a second
  if (!HANDOFF || embedded || window.top !== window.self || borrowed || q.has("loginToken")) return Promise.resolve(null);
  borrowed = true;                         // (a Google or GitHub return finishes that sign-in instead)
  return new Promise(done => {
    const timer = setTimeout(() => { HANDOFF.onmessage = null; done(null); }, 1000);
    HANDOFF.onmessage = ev => {
      if (ev.data && typeof ev.data.session === "string") { clearTimeout(timer); HANDOFF.onmessage = null; done(ev.data.session); }
    };
    HANDOFF.postMessage({ask: "session"});
  });
}
// Outside Element: sign in with our homeserver, as Get your agent does (signin.js); @pm sees the throwaway
// session once, at /auth/page, and answers with the panel's own session (owner: the pop-out was blank).
const IDP_KEY = "hagency-panel-idp";
let signingInNow = false;                  // one attempt at a time (GPT review: overlapping ones raced)
function showSignIn() {
  clearTimeout(watchdog);
  if (window.top !== window.self || typeof SignIn === "undefined" || !SignIn) return void ($("me").innerHTML = 'Say <b>@pm send me my console link</b> in the room to sign in here.');
  const back = SignIn.returned(IDP_KEY);   // Google or GitHub brought this tab back
  if (room) history.replaceState(null, "", location.pathname + "?room=" + encodeURIComponent(room));
  if (back) return pageSignIn(back.login);
  say("Sign in to see this room's Hagency panel.");
  $("controls").innerHTML = '<section class="card"><div id="sso" class="field"></div><div id="password-box"></div></section>';
  SignIn.ssoButtons($("sso"), IDP_KEY);
  SignIn.form($("password-box"), "Sign in", pageSignIn);
}
async function pageSignIn(body) {
  if (signingInNow) return;
  signingInNow = true;
  signingIn();
  let r;
  try { r = await SignIn.handOver(body, "Hagency panel", "/auth/page"); } finally { signingInNow = false; }
  if (r.error || !r.data || typeof r.data.session !== "string") {
    showSignIn();
    return failed(r.error === "wrong" ? "Wrong username or password." : r.status === 429 ? "Too many sign-ins just now; "
                  + "please wait a few minutes." : (r.data && r.data.error) || OFFLINE);
  }
  $("controls").innerHTML = "";
  signedIn(r.data.session);
}
let msgMark = "";                         // the line came from Connect GitHub: githubMsgAfter (panel_github.js)
async function act(action, value, agent) { $("msg").textContent = "…";
  const r = await post("/console/action", {room, action, value, agent: agent || ""});
  $("msg").textContent = r.result === "ok" ? (r.says || "Done.") : (r.result || r.error);   // says: Update my agent
  if (r.link) showLink(r.link);             // the invite link: shown with Copy, and copied at once
  msgMark = action === "github" && value === "connect" ? "pending" : "";
  if (msgMark && pmChat && !inPmChat) $("msg").innerHTML = esc($("msg").textContent) + " " + pmChatLink("Open our private chat");
  refresh(); }
function showLink(link) {                  // the invite link, with its own Copy (never GitHub's data-copy handler)
  $("msg").innerHTML = `${esc($("msg").textContent)}<div class="field"><input id="invlink" readonly value="${esc(link)}">
    <button id="invcopy">Copy</button></div>`;
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(link);
      $("invcopy").textContent = "Copied ✓";
    } catch (e) {                           // refused (the frame or a lost click): selected, so Ctrl+C copies it
      $("invlink").focus(); $("invlink").select();
      $("invcopy").textContent = (typeof navigator !== "undefined" && /Mac/.test(navigator.platform) ? "Selected: press ⌘C" : "Selected: press Ctrl+C");
    }
  };
  $("invcopy").onclick = copy;
  copy();
}
function pmChatLink(text) {
  if (!pmChat) return esc(text);           // no private chat with @pm yet: plain words
  return `<a href="https://matrix.to/#/${esc(encodeURIComponent(pmChat))}" target="_blank" rel="noopener noreferrer" data-pmchat="1">${esc(text)}</a>`;
}
document.addEventListener("click", e => { const a = e.target.closest && e.target.closest("a[data-pmchat]");
  if (!a || !embedded || !canNavigate) return;      // a new tab, by the link itself
  e.preventDefault(); navHref = a.href; const sent = navRequest = "nav-" + crypto.randomUUID();
  window.parent.postMessage({api: "fromWidget", widgetId: wid, requestId: sent, action: NAVIGATE, data: {uri: a.href}}, ELEMENT);
  setTimeout(() => { if (navRequest === sent) { navRequest = null; navFallback(); } }, NAV_WAIT_MS); });
// "Welcome steps": Element's home page (common/bridge_config.ELEMENT_HOME). The widget API can't open it
// (navigate takes only matrix.to links to a room or a person) and Element's sandbox forbids navigating its
// window from here (seen live: SecurityError). Inside our own Element the panel shares its origin, so the
// same link clicked in Element's own document opens the page in place; anywhere else it's a new tab.
document.addEventListener("click", e => { const a = e.target.closest && e.target.closest("a[data-home]");
  if (!a || !embedded || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;   // a new tab, asked for (GPT review)
  let doc;
  try { doc = window.top.document; } catch (err) { return; }   // another origin: the link's own new tab is the way
  e.preventDefault(); const link = doc.createElement("a"); link.href = "#/home";
  doc.body.appendChild(link); link.click(); link.remove(); });
// Refused, or no answer: a link to click (GPT review: a tab opened later, not by the click, is blocked).
function navFallback() { $("msg").innerHTML = `Element didn't open the chat here: <a href="${esc(navHref)}" target="_blank"
  rel="noopener noreferrer">open your chat with Product Manager</a>.`; }
// A card whose script didn't load (a proxy that doesn't route it) shows a note; the rest of the panel still works.
const card = (name, s) => typeof window[name] === "function" ? window[name](s)
  : `<section class="card"><h2>Unavailable</h2><div class="muted">Part of this panel didn't load. Reload, or tell the server's owner.</div></section>`;
// Two-click buttons: Remove an agent (panel_agents.js), Remove repo (panel_project.js). Without its
// script, nothing can arm one: refused.
const ok = b => { const check = {remove: "confirmed", unrepo: "repoConfirmed"}[b.dataset.a];
  return !check || (typeof window[check] === "function" && window[check](b)); };
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
function buttons(name, values, current, enabled) {
  const live = v => typeof enabled === "function" ? enabled(v) : enabled;   // a function: per button
  return `<span class="seg">` + values.map(v => `<button data-a="${esc(name)}" data-v="${esc(v)}" ${v === current ? 'class=on' : ''}
    ${live(v) ? '' : 'disabled'}>${esc(cap(v))}</button>`).join("") + `</span>`; }
document.addEventListener("click", e => { const b = e.target.closest("button[data-a]");
  if (b && ok(b)) act(b.dataset.a, b.dataset.a === "repo" ? $("repo").value.trim() : b.dataset.a === "add" ? (typeof addValue === "function" ? addValue() : $("newagent").value.trim())
    : b.dataset.a === "rename" ? $("rename-" + b.dataset.g).value.trim() : b.dataset.v, b.dataset.g); });
let polling = false;                        // one view request at a time (GPT review: a late 401 of an old session)
async function refresh() {
  if (!session || polling) return;
  polling = true;
  try { await show(); } finally { polling = false; }
}
async function show() {
  const sent = session;
  let s;
  try { const r = await fetch("console/state?room=" + encodeURIComponent(room), {signal: deadline(),
      headers: {"Authorization": "Bearer " + sent}});
    if (r.status === 401) { if (sent !== session) return;
      session = null; try { sessionStorage.removeItem("hagency-session"); } catch (e) { /* blocked */ }
      if (!embedded) { $("p").innerHTML = ""; $("controls").innerHTML = ""; $("title").textContent = "Hagency"; if (typeof showCards === "function") showCards(null);
        return start(); }                    // popped out: back to its sign-in, never Element's error (GPT review)
      return ++expired > 2 ? failed(NO_ANSWER) : start(); }
    s = await r.json(); } catch (e) { return failed(OFFLINE); }
  if (s.error) return failed(s.error);
  expired = 0; clearTimeout(watchdog); pmChat = s.pm_chat || null; inPmChat = !!s.personal;
  if (msgMark && typeof githubMsgAfter === "function" && !(msgMark = githubMsgAfter(msgMark, s))) $("msg").textContent = "";
  const typing = document.activeElement && document.activeElement.id;
  const sameCode = typing === "ghcode" && s.github && s.github.code === $("ghcode").value   // a code gone: redrawn
    || typeof ghCodeKept === "function" && ghCodeKept(typing, s, typing && $(typing).value);   // My agents' code too
  const fields = ["repo", "newagent", "newkind", "newmodel", "newbase"];
  if (typing && (fields.includes(typing) || sameCode || typing.startsWith("rename-"))) return;   // don't wipe what's being typed
  $("me").textContent = "";
  $("title").textContent = s.room;
  if (s.personal) return personal(s);       // My Hagency: their own cards only (console_personal.py)
  $("sub").innerHTML = s.repo ? `<span class="chip code">${esc(s.repo)}</span>` : `<span class="chip">Pick a project repo</span>`;
  $("who").innerHTML = `<span class="chip">${esc(s.user)}</span> <span class="chip role">${s.moderator ? "Owner / maintainer" : "Contributor"}</span>`;
  let h = "";
  if (s.waiting && s.waiting.mine) h += `<section class="card attn"><h2>Waiting for you</h2><div class="set"><div>${esc(cap(s.waiting.kind))}${
    s.waiting.items.length ? ": " + s.waiting.items.map(esc).join(" · ") : ""}</div>
    <button class="primary" data-a="approve" data-v="${esc(s.waiting.id)}">Approve 👍</button></div></section>`;
  const mode = typeof window.modeCard === "function" ? card("modeCard", s)   // its script missing: still a way to pause
    : `<section class="card"><h2>Mode</h2>${buttons("mode", ["off"], s.mode, s.moderator)}</section>`;
  h += `<div class="grid">${card("repoCard", s)}${mode}</div>`;   // the repo first, then its mode (GPT review)
  h += card("projectCard", s) + card("githubCard", s) + card("agentCards", s);   // panel_project.js, panel_github.js, panel_agents.js
  $("controls").innerHTML = h; $("p").innerHTML = s.html;      // s.html: server-escaped board (panel.render)
  if (typeof showCards === "function") showCards(s);           // Your cards (panel_cards.js): kept, not redrawn
}
function personal(s) {
  $("sub").innerHTML = '<span class="chip">Your agents and GitHub, the same in every room</span>';
  $("who").innerHTML = `<span class="chip">${esc(s.user)}</span>`;
  $("controls").innerHTML = card("agentCards", s) + card("githubCard", s);
  if (typeof showCards === "function") showCards(null);
  $("p").innerHTML = "";
}
start(); setInterval(refresh, __REFRESH_MS__);
</script>
