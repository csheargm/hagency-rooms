name: tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read            # pull requests from forks get read-only access and no secrets
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5, pinned
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install Jinja2==3.1.6   # deploy/test_sso_login.py renders Synapse's sign-in templates
      - run: python -m unittest discover -p 'test_*.py'
      - run: python -m unittest discover -s deploy -p 'test_*.py'   # the public server's tools
