# Mounted into Element's nginx at /etc/nginx/conf.d/ (docker-compose.yml), next to the image's own
# default.conf, which it leaves alone. At http level it applies to Element's index.html: it links
# Hagency's style fixes (element_page/element-fixes.css, served by Caddy at /hagency/).
sub_filter '</head>' '<link rel="stylesheet" href="/hagency/element-fixes.css"></head>';
sub_filter_once on;
