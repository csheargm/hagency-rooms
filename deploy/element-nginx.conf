# Mounted into Element's nginx at /etc/nginx/conf.d/ (docker-compose.yml), next to the image's own
# default.conf, which it leaves alone. At http level it applies to Element's index.html: it links
# Hagency's style fixes (element_page/element-fixes.css) and its "Hagency panel" button for a minimised
# panel (element_page/panel-dock.js, docs/adr/0026), both served by Caddy at /hagency/.
sub_filter '</head>' '<link rel="stylesheet" href="/hagency/element-fixes.css"><script src="/hagency/panel-dock.js" defer></script></head>';
sub_filter_once on;
