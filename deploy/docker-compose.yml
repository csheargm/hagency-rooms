# Hagency Rooms on the Oracle VM: Caddy (TLS) in front of Element Web, Synapse and @pm's console.
# Only Caddy publishes ports (80/443, plus 8448 for federation). Postgres, Synapse and @pm stay internal.
# Images are pinned here, so a deploy of a commit always runs the same versions (docs/DEPLOY_ORACLE.md).
# The site is GitHub Pages. People's own agents run on their computers (connect.py), never here; only the
# shared, talk-only trial agent runs in @pm's container, with OLLAMA_API_KEY set (ADR 0025).
name: hagency
x-logs: &logs                           # Docker's logs stay small on the 45 GB disk
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  caddy:
    image: caddy:2.11.9
    # bootstrap.sh sets HAGENCY_BIND_IP (the default route's address); 0.0.0.0 only for a bare `docker compose`
    ports: ["${HAGENCY_BIND_IP:-0.0.0.0}:80:80", "${HAGENCY_BIND_IP:-0.0.0.0}:443:443", "${HAGENCY_BIND_IP:-0.0.0.0}:8448:8448"]
    environment:
      ROOMS_DOMAIN: ${ROOMS_DOMAIN}
      MATRIX_DOMAIN: ${MATRIX_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./flags:/flags:ro               # guard.py's media-paused switch
      - ./element-home:/srv/element-home:ro   # Element's home page, logo, background (element_home.py)
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [synapse, element, pm, synapse-admin]
    networks: [edge]
    logging: *logs
    restart: unless-stopped
  synapse:
    image: matrixdotorg/synapse:v1.165.0
    volumes: ["./synapse:/data", "./synapse_modules:/modules:ro"]   # hagency_pm_moderator: @pm moderates new rooms
    environment:
      PYTHONPATH: /modules
    depends_on: [postgres]
    networks: [edge, db]
    logging: *logs
    restart: unless-stopped
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"   # what Synapse requires
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [db]                      # only Synapse reaches the database
    logging: *logs
    restart: unless-stopped
  element:
    # The same release with Element's own modules in /modules, loaded at start; only widget-lifecycle
    # is configured (element_home.py: our panel opens without two permission prompts).
    image: ghcr.io/element-hq/element-web/modules:v1.12.35
    volumes: ["./element-config.json:/app/config.json:ro",
              "./element-nginx.conf:/etc/nginx/conf.d/hagency.conf:ro"]   # links element_page/element-fixes.css
    networks: [edge]
    logging: *logs
    restart: unless-stopped
  synapse-admin:                        # the admin web UI (static), only at ADMIN_DOMAIN behind Cloudflare Access
    image: ghcr.io/etkecc/synapse-admin:v0.11.4-etke54@sha256:668552a2b59df4dc99f9d7a798372b67733173158e50b3784611d1dbd0d5a905
    volumes: ["./synapse-admin-config.json:/var/public/config.json:ro"]   # restrictBaseUrl: this server only
    networks: [edge]
    logging: *logs
    restart: unless-stopped
  pm:                                   # @pm: welcome, pairing (/connect) and the console, as the deploy user
    image: python:3.12.16-slim
    user: "${PM_UID}:${PM_UID}"
    working_dir: /app
    command: ["sh", "deploy/pm_start.sh"]
    environment:
      HOME: /app
      HAGENCY_HOMESERVER: http://synapse:8008
      HAGENCY_SERVER_NAME: ${SERVER_NAME}
      HAGENCY_PUBLIC_HOMESERVER: https://${MATRIX_DOMAIN}
      HAGENCY_PUBLIC_CONSOLE: https://${ROOMS_DOMAIN}
      ELEMENT_ORIGIN: https://${ROOMS_DOMAIN}
      HAGENCY_PANEL_EMBEDDERS: ${PANEL_EMBEDDERS-vector://vector https://app.element.io https://develop.element.io https://staging.element.io}
      HAGENCY_SHARED_SECRET_FILE: /run/hagency/registration_shared_secret
      HAGENCY_TRUST_PROXY: caddy          # X-Forwarded-For counts only from Caddy's address
      HAGENCY_OPERATOR: ${OPERATOR:-}     # who guard.py's warnings go to
      HAGENCY_ALLOW_REMOTE: ${ALLOW_REMOTE:-1}       # people from other servers may get an agent (0: off)
      HAGENCY_REMOTE_PER_HOUR: ${REMOTE_PER_HOUR:-10}   # at most this many of their agents made per hour
      HAGENCY_TEST_LIMITS: ${HAGENCY_TEST_LIMITS:-0}   # 1: higher per-person limits while testing (common/test_limits.py)
      PANEL_HOST: 0.0.0.0                 # reachable by Caddy on the edge network only
      PM_BRAIN: "owner"                   # @pm itself uses no model key: it reads with the room owner's agent (ADR 0022), else its phrase rules
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}   # @pm reads GitHub as its read-only App (docs/GITHUB_APP.md)
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-hagency-rooms}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}   # Connect GitHub (device flow); public, not the secret
      GITHUB_APP_PRIVATE_KEY_PATH: /run/hagency-github/github-app.pem
      HAGENCY_REPOS: ${HAGENCY_REPOS:-}   # optional: only these repos (empty: any with the App and write access)
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}   # the trial agent (ADR 0025): empty = off; its messages go to Ollama Cloud
      TRIAL_MODELS: ${TRIAL_MODELS:-glm-5.3,kimi-k3.1-pro*2,kimi-k2.7-code,deepseek-v4.1-flash,gpt-oss:120b}   # visitors pick; first = default
      TRIAL_PER_VISITOR: ${TRIAL_PER_VISITOR:-50}   # messages per visitor per UTC day
      TRIAL_PER_SERVER: ${TRIAL_PER_SERVER:-1000}   # messages for the whole server per UTC day
      TRIAL_MAX_TOKENS: ${TRIAL_MAX_TOKENS:-1500}
      TRIAL_TIMEOUT_S: ${TRIAL_TIMEOUT_S:-90}
      TRIAL_MAX_SHARE: ${TRIAL_MAX_SHARE:-0.5}   # trials stop at this share of the Ollama plan's month (never pay-as-you-go)
      TRIAL_MONTHLY_TOKENS: ${TRIAL_MONTHLY_TOKENS:-5000000}
      TRIAL_QUEUE_WAIT_S: ${TRIAL_QUEUE_WAIT_S:-20}   # one model call at a time; then "busy, try again"
      TRIAL_PAUSE_S: ${TRIAL_PAUSE_S:-900}
      TRIAL_VISITOR_TOKENS: ${TRIAL_VISITOR_TOKENS:-150000}   # tokens per visitor per UTC day
      TRIAL_REMOTE_TOKENS: ${TRIAL_REMOTE_TOKENS:-50000}     # the same for people from other servers   # a 429/402 from Ollama pauses trials this long (or its Retry-After)
    volumes:
      - ../../pm:/app                   # ~/hagency/pm: this commit's files (deploy.sh) and @pm's state
      - ./pm-secret:/run/hagency:ro     # root-owned on the host: @pm can read the secret, never replace it
      - ./secrets:/run/hagency-github:ro   # the App's private key (envfile.py checks it: mode 600, PM_UID)
      - ../../trial-shared:/app/data/trial-shared   # trial builds' queue and heartbeat, shared with trial-worker (no secrets)
    depends_on: [synapse]
    networks: [edge]
    logging: *logs
    stop_grace_period: 2m               # @pm finishes what it started (lifecycle.py)
    restart: unless-stopped
  # Trial builds (docs/adr/0027-trial-builds.md, docs/TRIAL_BUILDER_SETUP.md): it only orchestrates; untrusted code
  # runs in E2B microVMs, never here. Only trial.env (the E2B key, the Trial App, its Ollama key): never @pm's .env, the
  # registration secret or @pm's App key; never on db or edge. Not configured: it exits at once and stays stopped.
  trial-worker:
    image: python:3.12.16-slim
    user: "${PM_UID}:${PM_UID}"
    working_dir: /app
    command: ["sh", "deploy/trial_worker_start.sh"]
    env_file: [{path: ./trial.env, required: false}]
    environment:
      HOME: /tmp
      TRIAL_SHARED_DIR: /shared
      TRIAL_APP_PRIVATE_KEY_PATH: /run/hagency-trial/trial-app.pem
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../server:/app/server:ro        # this commit's code only (no .env, no data)
      - ../common:/app/common:ro
      - ./trial_worker_start.sh:/app/deploy/trial_worker_start.sh:ro
      - ../requirements.txt:/app/requirements.txt:ro
      - ../requirements-trial.txt:/app/requirements-trial.txt:ro
      - ../../trial-shared:/shared      # the queue, the heartbeat, the leases, the Ollama slot's lock
      - ./trial-secrets:/run/hagency-trial:ro   # the Trial Builder App's key (mode 600)
      - ../../trial-venv:/venv          # its pinned requirements, kept between starts (bootstrap.sh makes it)
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    cpus: 0.5
    mem_limit: 512m
    networks: [trial-out]
    logging: *logs
    stop_grace_period: 30s
    restart: on-failure
networks:
  edge: {}
  db: {internal: true}                  # no route out, and nothing but Synapse on it
  trial-out: {}                         # trial-worker alone: out to E2B, GitHub and Ollama Cloud
volumes:
  caddy_data: {}
  caddy_config: {}
  postgres: {}
